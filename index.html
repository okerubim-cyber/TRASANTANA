<!-- =====================================================================

     EDITE AQUI: dados do site e link da planilha

     ===================================================================== -->

<script>

const CONFIG = {

  nome: "T.R.A Santana",

  whatsapp: "5543999773495",

  whatsappExibir: "(43) 99977-3495",

  cnpj: "67.218.109/0001-70",

  endereco: "Arapongas - PR",

  codigoRevendedor: "TRA2026",

  

  // SEU LINK CSV DO GOOGLE PLANILHAS

  LINK_PLANILHA: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwkxBsWzOPpY_ndgnFPJZrD6hPrPjg1XAwt6slM5LzgpxHRNmbWiJGNjiQTMp-D8B6HdYdP_p7ckmA/pub?gid=0&single=true&output=csv"

};



// Começa vazio e é preenchido automaticamente pela planilha

let PRODUTOS = []; 



async function carregarPlanilhaDoGoogle() {

  if (!CONFIG.LINK_PLANILHA || CONFIG.LINK_PLANILHA.includes("COLE_O_LINK")) return;



  try {

    const resposta = await fetch(CONFIG.LINK_PLANILHA);

    const texto = await resposta.text();

    

    const linhas = texto.split('\n').filter(l => l.trim() !== '');

    const cabecalhos = linhas[0].split(',').map(c => c.trim().toLowerCase());

    

    PRODUTOS = linhas.slice(1).map(linha => {

      const valores = linha.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"\vert{}"$/g, '').trim());

      let obj = {};

      cabecalhos.forEach((cab, i) => obj[cab] = valores[i]);

      

      // Converte a coluna foto em uma lista se houver múltiplos links separados por ";"

      const fotosLista = obj.foto ? obj.foto.split(';').map(f => f.trim()) : [];



      return {

        id: obj.id || (obj.nome ? obj.nome.replace(/\s+/g, '-').toLowerCase() : 'id-gerado'),

        nome: obj.nome || '',

        categoria: obj.categoria || 'Geral',

        foto: fotosLista[0] || '',

        galeria: fotosLista,

        medidas: obj.medidas || '',

        material: obj.material || '',

        cores: obj.cores ? obj.cores.split(';').map(c => c.trim()) : [],

        portas: obj.portas || '',

        gavetas: obj.gavetas || '',

        espelho: obj.espelho || '',

        estoque: obj.estoque || '',

        descricao: obj.descricao || obj['descrição'] || '',

        minimo: parseInt(obj.minimo) || 1,

        varejo: parseFloat(obj.varejo) || 0,

        atacado: parseFloat(obj.atacado) || 0

      };

    });



    // Atualiza a exibição na tela após carregar os produtos

    if (typeof renderizarProdutos === 'function') {

      renderizarProdutos();

    }

  } catch (erro) {

    console.error("Erro ao carregar os dados da planilha Google:", erro);

  }

}



// Função para renderizar a janela de detalhes do produto

function abrirDetalhe(p) {

  const esc = (txt) => String(txt || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');



  // Preenche a ficha técnica dinamicamente

  const techElem = document.querySelector('#detail-tech');

  if (techElem) {

    techElem.innerHTML = `<h3>Ficha técnica</h3><dl>

      <div><dt>Código</dt><dd>${esc(p.id)}</dd></div>

      <div><dt>Categoria</dt><dd>${esc(p.categoria || 'Geral')}</dd></div>

      <div><dt>Material</dt><dd>${esc(p.material || 'Não informado')}</dd></div>

      <div><dt>Medidas</dt><dd>${esc(p.medidas || 'Não informado')}</dd></div>

      <div><dt>Cores disponíveis</dt><dd>${esc((p.cores || []).join(', ') || 'Consultar')}</dd></div>



      ${p.portas ? `<div><dt>Portas</dt><dd>${esc(p.portas)}</dd></div>` : ''}

      ${p.gavetas ? `<div><dt>Gavetas</dt><dd>${esc(p.gavetas)}</dd></div>` : ''}

      ${p.espelho ? `<div><dt>Espelho</dt><dd>${esc(p.espelho)}</dd></div>` : ''}

      ${p.estoque ? `<div><dt>Estoque</dt><dd>${esc(p.estoque)}</dd></div>` : ''}



      <div><dt>Pedido mínimo</dt><dd>${p.minimo} unidade(s)</dd></div>

    </dl>`;

  }



  // Preenche a Descrição dinamicamente (se existir)

  const descElem = document.querySelector('#detail-description');

  if (descElem) {

    descElem.innerHTML = p.descricao ? `

      <h3>Descrição</h3>

      <p>${esc(p.descricao)}</p>

    ` : '';

  }



  // Abre o modal de detalhes

  const dlg = document.querySelector('dialog.product-dlg');

  if (dlg) dlg.showModal();

}



// Inicia a busca assim que o navegador carregar a página

document.addEventListener('DOMContentLoaded', carregarPlanilhaDoGoogle);

</script>

    margin-left:0;

  }



  .detail-gallery{

    flex:0 0 32vh;

    min-height:220px;

    padding:10px;

  }



  .detail-info{

    padding:18px;

  }



  .measures-visual{

    grid-template-columns:1fr 1fr;

  }



  .detail-actions .btn{

    min-width:0;

  }

}



/* gaveta do pedido */

.veil{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}

.veil.on{opacity:1;visibility:visible;transition:opacity .25s}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(450px,100%);background:var(--panel);border-left:1px solid var(--gold-lo);z-index:70;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}

.drawer.on{transform:none;visibility:visible;transition:transform .28s ease}

.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}

.drawer-head h2{font-size:30px}

.x{background:none;border:1px solid var(--line);border-radius:6px;width:38px;height:38px;cursor:pointer;font-size:20px;color:var(--muted)}

.x:hover{color:var(--text);border-color:var(--gold-lo)}

.drawer-body{flex:1;overflow:auto;padding:6px 22px}

.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:16px 0;border-bottom:1px solid var(--line)}

.line b{font-weight:500}

.line .sub{font-size:14px;color:var(--muted)}

.line .sub .g{color:var(--green)}

.line .ctrl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}

.line .rm{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14.5px}

.line .rm:hover{color:#F0A29A}

.drawer-empty{padding:48px 6px;text-align:center;color:var(--muted)}

.drawer-empty .btn{margin-top:14px}

.drawer-foot{padding:18px 22px 22px;border-top:1px solid var(--line);display:grid;gap:12px;background:var(--panel2)}

.tot{display:grid;gap:4px;font-size:16px}

.tot div{display:flex;justify-content:space-between}

.tot .g{color:var(--green);font-weight:600}

.drawer-foot .two{gap:10px}

.drawer-foot small{color:var(--muted);font-size:14px}



/* diálogo do código */

dialog.dlg{margin:auto;background:var(--panel);color:var(--text);border:1px solid var(--gold-lo);border-radius:14px;padding:28px;width:min(430px,calc(100% - 32px))}

dialog.dlg::backdrop{background:rgba(0,0,0,.7)}

.dlg h2{font-size:32px;margin-bottom:8px}

.dlg p{color:var(--muted);margin-bottom:16px}

.dlg .row{display:flex;gap:10px;margin-bottom:6px}

.dlg .row .btn{white-space:nowrap}

.dlg .alt{display:block;margin-top:14px;color:var(--gold-hi);text-decoration:underline;font-size:15px}

.dlg .close{margin-top:12px;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline}



.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--gold);color:var(--ink);font-weight:500;padding:11px 20px;border-radius:6px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}

.toast.on{opacity:1;transform:translate(-50%,0)}

.wa{position:fixed;right:18px;bottom:18px;z-index:50;background:#1FA855;color:#fff;border-radius:999px;padding:13px 20px;font-weight:500;display:flex;gap:10px;align-items:center;box-shadow:0 10px 28px -10px rgba(0,0,0,.7)}

.wa svg{width:22px;height:22px}

@media(max-width:520px){.wa span{display:none}.wa{padding:14px}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>

</head>
