<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.R.A SANTANA - Distribuidora de Móveis</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --accent: #c5a059;
      --text: #e2e8f0;
      --subtext: #94a3b8;
      --border: #232d42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; padding: 20px; line-height: 1.5; }
    header { text-align: center; padding: 30px 10px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    h1 { color: var(--accent); font-size: 2rem; letter-spacing: 2px; }
    .status-bar { text-align: center; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; font-weight: 500; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; background: #000; }
    .card h3 { font-size: 1.1rem; color: #fff; }
    .price-tag { background: #1e293b; padding: 8px; border-radius: 6px; font-size: 0.9rem; }
    .price-tag b { color: var(--accent); }
    .btn { background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>T.R.A SANTANA</h1>
    <p style="color: var(--subtext);">Distribuidora de Móveis</p>
  </header>

  <div id="catalogStatus" class="status-bar">Iniciando carregamento do catálogo...</div>

  <main>
    <div id="productGrid" class="grid"></div>
  </main>

  <script>
  // COLOQUE SEU LINK DO CSV DO GOOGLE SHEETS AQUI (Publicado na web)
  const LINK_PLANILHA = 
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwkxBsWzOPpY_ndgnFPJZrD6hPrPjg1XAwt6slM5LzgpxHRNmbWiJGNjiQTMp-D8B6HdYdP_p7ckmA/pub?gid=0&single=true&output=csv";

  const CONFIG = {
    nome: "T.R.A SANTANA",
    whatsapp: "5543999999999"
  };

  const dinheiro = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  async function carregarCatalogo() {
    const status = document.getElementById("catalogStatus");
    const grid = document.getElementById("productGrid");

    if (!LINK_PLANILHA || LINK_PLANILHA.includes("SUA_URL_DO_CSV")) {
      status.innerHTML = '<span class="err">⚠️ Configure a variável LINK_PLANILHA no código com o link do seu CSV público do Google Sheets.</span>';
      return;
    }

    try {
      const res = await fetch(LINK_PLANILHA, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);

      const texto = await res.text();
      const linhas = texto.split("\n").map(l => l.split(","));

      if (linhas.length <= 1) {
        status.innerHTML = '<span class="err">A planilha está sem produtos.</span>';
        return;
      }

      status.innerHTML = `<span class="ok">✓ Catálogo carregado com sucesso! (${linhas.length - 1} produtos)</span>`;

      grid.innerHTML = linhas.slice(1).map(col => {
        const nome = col[1] ? col[1].replace(/"/g, '') : "Produto";
        const categoria = col[2] ? col[2].replace(/"/g, '') : "Geral";
        const foto = col[3] ? col[3].replace(/"/g, '').trim() : "";
        const varejo = col[6] ? col[6].replace(/[^\d,.-]/g, '').replace(',', '.') : 0;
        const atacado = col[7] ? col[7].replace(/[^\d,.-]/g, '').replace(',', '.') : 0;

        return `
          <div class="card">
            ${foto ? `<img src="${foto}" alt="${nome}" onerror="this.style.display='none'">` : ''}
            <div>
              <small style="color:var(--subtext);">${categoria}</small>
              <h3>${nome}</h3>
            </div>
            <div class="price-tag">
              <div>Atacado: <b>${dinheiro(atacado)}</b></div>
              <div>Sugerido: <b>${dinheiro(varejo)}</b></div>
            </div>
            <a class="btn" href="https://wa.me/${CONFIG.whatsapp}?text=Olá,%20tenho%20interesse%20no%20produto:%20${encodeURIComponent(nome)}" target="_blank">Pedir via WhatsApp</a>
          </div>
        `;
      }).join("");

    } catch (err) {
      console.error(err);
      status.innerHTML = `<span class="err">Erro ao carregar a planilha: ${err.message}</span>`;
    }
  }

  document.addEventListener("DOMContentLoaded", carregarCatalogo);
  </script>
</body>
</html>
