<script>
  (() => {
    "use strict";

    const $ = (selector, root = document) => root.querySelector(selector);     const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

    const state = {
      categoria: "Todos",
      busca: "",
      carrinho: new Map(),
      revendedor: null
    };

    const dinheiro = (valor) => {
      const n = Number(valor) || 0;
      return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    };

    const numeroBR = (valor) => {
      if (typeof valor === "number") return valor;
      let s = String(valor ?? "").trim().replace(/[^\d,.-]/g, "");
      if (s.includes(",") && s.includes(".")) {
        if (s.lastIndexOf(",") > s.lastIndexOf(".")) {
          s = s.replace(/\./g, "").replace(",", ".");
        } else {
          s = s.replace(/,/g, "");
        }
      } else if (s.includes(",")) {
        s = s.replace(",", ".");
      }
      const n = Number(s);
      return Number.isFinite(n) ? n : 0;
    };

    const escapar = (valor) => String(valor ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

    const csvParse = (texto) => {
      const linhas = [];
      let linha = [];
      let campo = "";
      let aspas = false;

      for (let i = 0; i < texto.length; i++) {
        const c = texto[i];
        const n = texto[i + 1];

        if (c === '"' && aspas && n === '"') {
          campo += '"';
          i++;
        } else if (c === '"') {
          aspas = !aspas;
        } else if (c === "," && !aspas) {
          linha.push(campo);
          campo = "";
        } else if ((c === "\n" || c === "\r") && !aspas) {
          if (c === "\r" && n === "\n") i++;
          linha.push(campo);
          if (linha.some(v => String(v).trim() !== "")) linhas.push(linha);
          linha = [];
          campo = "";
        } else {
          campo += c;
        }
      }

      linha.push(campo);
      if (linha.some(v => String(v).trim() !== "")) linhas.push(linha);
      return linhas;
    };

    function produtoNormalizado(col) {
      return {
        id: String(col[0] ?? "").trim(),
        nome: String(col[1] ?? "").trim(),
        categoria: String(col[2] ?? "Geral").trim() || "Geral",
        tipo: "geral",
        foto: String(col[3] ?? "").trim(),
        medidas: String(col[4] ?? "").trim(),
        material: String(col[5] ?? "").trim(),
        cores: ["Conforme catálogo"],
        minimo: Math.max(1, parseInt(String(col[8] ?? "1").trim(), 10) || 1),
        varejo: numeroBR(col[6]),
        atacado: numeroBR(col[7])
      };
    }

    async function carregarCatalogoSeguro() {
      const status = $("#catalogStatus");

      try {
        const resposta = await fetch(LINK_PLANILHA, { cache: "no-store" });
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);

        const textoCSV = await resposta.text();
        const linhas = csvParse(textoCSV);

        if (linhas.length < 2) {
          PRODUTOS = [];
        } else {
          PRODUTOS = linhas.slice(1)
            .map(produtoNormalizado)
            .filter(p => p.nome);
        }

        if (!PRODUTOS.length) {
          status.innerHTML = '<span>Nenhum produto válido foi encontrado na planilha.</span>';
        } else {
          status.innerHTML = '<span class="ok">✓ Catálogo atualizado</span><span>' +
            PRODUTOS.length + ' produto(s) carregado(s).</span>';
        }

        montarCategorias();
        atualizarHero();
        renderizarProdutos(PRODUTOS);
      } catch (erro) {
        console.error("Erro ao carregar produtos:", erro);
        status.innerHTML =
          '<span>Não foi possível carregar a planilha agora.</span>' +
          '<button type="button" id="retryCatalog">Tentar novamente</button>';
        $("#retryCatalog")?.addEventListener("click", carregarCatalogoSeguro);
      }
    }

    function montarCategorias() {
      const container = $("#categoryChips");
      const categorias = [...new Set(PRODUTOS.map(p => p.categoria).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "pt-BR"));

      container.innerHTML =
        '<button class="chip" type="button" data-category="Todos" aria-pressed="true">Todos</button>' +
        categorias.map(cat =>
          '<button class="chip" type="button" data-category="' +
          escapar(cat) + '" aria-pressed="false">' + escapar(cat) + '</button>'
        ).join("");

      $$(".chip", container).forEach(btn => {         btn.addEventListener("click", () => {           state.categoria = btn.dataset.category;           $$
(".chip", container).forEach(x =>
            x.setAttribute("aria-pressed", x === btn ? "true" : "false")
          );
          renderizarProdutos(PRODUTOS);
        });
      });
    }

    function renderizarProdutos(produtos = PRODUTOS) {
      const grid = $("#productGrid");
      const lista = produtos.filter(p => {
        const termo = state.busca.toLowerCase().trim();
        const categoriaOk = state.categoria === "Todos" || p.categoria === state.categoria;
        const texto = [p.nome, p.categoria, p.material, p.medidas].join(" ").toLowerCase();
        return categoriaOk && (!termo || texto.includes(termo));
      });

      if (!lista.length) {
        grid.innerHTML =
          '<div class="empty">Nenhum produto encontrado.<br>' +
          '<button class="btn btn-outline" type="button" id="clearFilters">Limpar filtros</button></div>';
        $("#clearFilters")?.addEventListener("click", () => {
          state.categoria = "Todos";
          state.busca = "";
          $("#searchInput").value = "";           $$(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.category === "Todos" ? "true" : "false"));
          renderizarProdutos(PRODUTOS);
        });
        return;
      }

      grid.innerHTML = lista.map(p => {
        const lucro = Math.max(0, p.varejo - p.atacado);
        const margem = p.varejo > 0 ? (lucro / p.varejo) * 100 : 0;
        const qtd = state.carrinho.get(p.id)?.qtd || 0;
        const foto = p.foto
          ? '<img src="' + escapar(p.foto) + '" alt="' + escapar(p.nome) + '" loading="lazy" onerror="this.style.display=\'none\'">'
          : '<div aria-hidden="true" style="font-family:var(--serif);font-size:42px;color:var(--gold);">T.R.A</div>';

        return `
          <article class="card" data-id="${escapar(p.id)}">
            <div class="photo">${foto}</div>
            <div class="body">
              <div class="cat-name">${escapar(p.categoria)}</div>
              <h3>${escapar(p.nome)}</h3>

              <div class="specs">
                ${p.medidas ? `<div>Medidas: <b>${escapar(p.medidas)}</b></div>` : ""}
                ${p.material ? `<div>Material: <b>${escapar(p.material)}</b></div>` : ""}
              </div>

              <div class="price">
                <div class="row"><span>Atacado</span><b>${dinheiro(p.atacado)}</b></div>
                <div class="row"><span>Venda sugerida</span><b>${dinheiro(p.varejo)}</b></div>
                <div class="row profit"><span>Lucro bruto</span><b>${dinheiro(lucro)} <em>${margem.toFixed(0)}%</em></b></div>
                <div class="pbar" aria-label="Margem de lucro de ${margem.toFixed(0)}%"><i style="width:${Math.min(100, Math.max(0, margem))}%"></i></div>
              </div>

              <div class="min">Mínimo: ${p.minimo} unidade(s)</div>

              <div class="buy">
                <div class="step">
                  <button type="button" data-action="minus" data-id="${escapar(p.id)}" ${qtd <= 0 ? "disabled" : ""}>−</button>
                  <output>${qtd}</output>
                  <button type="button" data-action="plus" data-id="${escapar(p.id)}">+</button>
                </div>
                <button class="btn btn-gold" type="button" data-action="add" data-id="${escapar(p.id)}">
                  ${qtd ? "Atualizar" : "Adicionar"}
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      $$("[data-action]", grid).forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const produto = PRODUTOS.find(p => p.id === id);
          if (!produto) return;

          const atual = state.carrinho.get(id)?.qtd || 0;
          let nova = atual;

          if (btn.dataset.action === "plus") nova = atual + produto.minimo;
          if (btn.dataset.action === "minus") nova = Math.max(0, atual - produto.minimo);
          if (btn.dataset.action === "add") nova = atual || produto.minimo;

          if (nova > 0) state.carrinho.set(id, { produto, qtd: nova });
          else state.carrinho.delete(id);

          atualizarCarrinho();
          renderizarProdutos(PRODUTOS);
        });
      });
    }

    function atualizarHero() {
      const p = PRODUTOS.find(x => x.atacado > 0 && x.varejo > 0);
      if (!p) return;

      const lucro = p.varejo - p.atacado;
      $("#heroAtacado").textContent = dinheiro(p.atacado);
      $("#heroVarejo").textContent = dinheiro(p.varejo);
      $("#heroLucro").textContent = dinheiro(lucro);
      $("#heroCost").textContent = "Atacado " + dinheiro(p.atacado);
      $("#heroGain").textContent = "Lucro " + dinheiro(lucro);
    }

    function resumoCarrinho() {
      let total = 0;
      let lucro = 0;
      let unidades = 0;

      for (const { produto, qtd } of state.carrinho.values()) {
        total += produto.atacado * qtd;
        lucro += Math.max(0, produto.varejo - produto.atacado) * qtd;
        unidades += qtd;
      }

      return { total, lucro, unidades };
    }

    function abrirCarrinho() {
      $("#cartVeil").classList.add("on");
      $("#cartDrawer").classList.add("on");
      $("#cartDrawer").setAttribute("aria-hidden", "false");
    }

    function fecharCarrinho() {
      $("#cartVeil").classList.remove("on");
      $("#cartDrawer").classList.remove("on");
      $("#cartDrawer").setAttribute("aria-hidden", "true");
    }

    function atualizarCarrinho() {
      const resumo = resumoCarrinho();
      $("#cartCount").textContent = resumo.unidades;
      $("#cartTotal").textContent = dinheiro(resumo.total);
      $("#cartProfit").textContent = dinheiro(resumo.lucro);
      $("#checkoutBtn").disabled = resumo.unidades === 0;

      const body = $("#cartBody");

      if (!state.carrinho.size) {
        body.innerHTML = `
          <div class="drawer-empty">
            Seu pedido está vazio.
            <br>
            <button class="btn btn-outline" type="button" id="emptyGoCatalog">Ver catálogo</button>
          </div>`;
        $("#emptyGoCatalog")?.addEventListener("click", () => {
          fecharCarrinho();
          $("#catalogo")?.scrollIntoView({ behavior: "smooth" });
        });
        return;
      }

      body.innerHTML = [...state.carrinho.values()].map(({ produto, qtd }) => {
        const subtotal = produto.atacado * qtd;
        const lucroUnitario = Math.max(0, produto.varejo - produto.atacado);
        return `
          <div class="line">
            <div>
              <b>${escapar(produto.nome)}</b>
              <div class="sub">${qtd}x ${dinheiro(produto.atacado)} <span class="g">(Lucro: ${dinheiro(lucroUnitario * qtd)})</span></div>
            </div>
            <b>${dinheiro(subtotal)}</b>
            <div class="ctrl">
              <button class="rm" type="button" data-remove="${escapar(produto.id)}">Remover</button>
            </div>
          </div>
        `;
      }).join("");

      $$("[data-remove]", body).forEach(btn => {
        btn.addEventListener("click", () => {
          state.carrinho.delete(btn.dataset.remove);
          atualizarCarrinho();
          renderizarProdutos(PRODUTOS);
        });
      });
    }

    function inicializar() {
      // Preenche os dados globais de CONFIG no topo e rodapé
      if (typeof CONFIG !== "undefined") {
        $("#topWhatsapp").textContent = CONFIG.whatsappExibir;
        $("#footerCnpj").textContent = CONFIG.cnpj;
        $("#footerEndereco").textContent = CONFIG.endereco;
        $("#footerWhatsapp").textContent = CONFIG.whatsappExibir;
        $("#heroWhatsapp").href = `https://wa.me/${CONFIG.whatsapp}`;
      }

      // Input de Busca
      $("#searchInput")?.addEventListener("input", (e) => {
        state.busca = e.target.value;
        renderizarProdutos(PRODUTOS);
      });

      // Handlers da Gaveta de Pedido
      $("#openCart")?.addEventListener("click", abrirCarrinho);
      $("#closeCart")?.addEventListener("click", fecharCarrinho);
      $("#cartVeil")?.addEventListener("click", fecharCarrinho);

      // Handler do Formulário de Cadastro / Envio WhatsApp
      $("#signupForm")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const errEl = $("#formError");
        errEl.textContent = "";

        const codigo = $("#codigo").value.trim();
        if (codigo !== CONFIG.codigoRevendedor) {
          errEl.textContent = "Código de revendedor inválido. Solicite via WhatsApp.";
          return;
        }

        state.revendedor = {
          nome: $("#nome").value.trim(),
          telefone: $("#telefone").value.trim(),
          cidade: $("#cidade").value.trim()
        };

        alert("Cadastro validado com sucesso! Agora você pode finalizar o pedido.");
        abrirCarrinho();
      });

      // Botão Enviar Pedido via WhatsApp
      $("#checkoutBtn")?.addEventListener("click", () => {
        if (!state.revendedor) {
          alert("Por favor, preencha a Área do Revendedor no fim da página antes de enviar o pedido.");
          fecharCarrinho();
          $("#cadastro")?.scrollIntoView({ behavior: "smooth" });
          return;
        }

        let msg = `*NOVO PEDIDO - ${CONFIG.nome}*\n\n`;
        msg += `*Revendedor:* ${state.revendedor.nome}\n`;
        msg += `*WhatsApp:* ${state.revendedor.telefone}\n`;
        msg += `*Cidade:* ${state.revendedor.cidade}\n\n`;
        msg += `*ITENS DO PEDIDO:*\n`;

        for (const { produto, qtd } of state.carrinho.values()) {
          msg += `• ${qtd}x ${produto.nome} - ${dinheiro(produto.atacado * qtd)}\n`;
        }

        const { total, lucro } = resumoCarrinho();
        msg += `\n*Total Atacado:* ${dinheiro(total)}`;
        msg += `\n*Lucro Estimado:* ${dinheiro(lucro)}`;

        const url = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
        window.open(url, "_blank");
      });

      // Carrega os dados da planilha
      carregarCatalogoSeguro();
    }

    document.addEventListener("DOMContentLoaded", inicializar);
  })();
  </script>
</body>
</html>
